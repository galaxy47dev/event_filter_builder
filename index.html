<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フィルター設定ファイル作成</title>
<style>
body{font-family:sans-serif;max-width:1200px;margin:auto;padding:20px}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.card{
  width:140px;
  height:140px;
  position:relative;
  border:1px solid #ccc;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  background:#fff}
.card-delete{
  position:absolute;

  top:4px;
  right:4px;

  width:24px;
  height:24px;

  border:none;
  border-radius:50%;

  cursor:pointer;

  font-size:16px;
  line-height:1;
}
.card:hover{background:#f5f5f5}
.add-card{font-size:48px;font-weight:bold}
.button-row{
  margin:20px 0 4px 0;
}

.button-row button{
  width:100%;
  padding:12px;
}

.summary{
  width:100%;
  height:100%;
  padding:8px;
  padding-top:32px;
  box-sizing:border-box;
  overflow:hidden;
}
.summary-line{
  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2; /* 最大2行 */
  line-height:1.2;
}
.output-row{
  display:flex;
  gap:12px;
}

#setting-output,
#json-output{
  flex:1;
  background:#f7f7f7;
  padding:12px;
  border-radius:8px;
  box-sizing:border-box;
}

#setting-output{
  white-space:pre-wrap;
}

#setting-output,
#json-output{
  min-height:300px;
  font-family:monospace;
  resize:vertical;
}

dialog{width:900px;max-width:95vw;border:none;border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.help-text{
  margin-top:0px;
  font-size:14px;
  color:#666;
  text-align:center;
}

</style>
</head>
<body>

<h1>フィルター設定ファイル作成</h1>

<div class="cards" id="cards"></div>

<div class="button-row">
  <button onclick="downloadSettings()">設定ファイル(JSON)をダウンロード</button>
</div>
<div class="help-text">
  ダウンロードしたファイルをGitHubリポジトリにアップロードして上書きしてください
</div>


<h2>設定内容</h2>

<div class="output-row">
  <pre id="setting-output"></pre>
  <textarea id="json-output"></textarea>
</div>

<dialog id="editor">
<h2>条件編集</h2>

<h3>曜日</h3>
<div id="weekdayBox">
<label><input type="checkbox" value="月">月</label>
<label><input type="checkbox" value="火">火</label>
<label><input type="checkbox" value="水">水</label>
<label><input type="checkbox" value="木">木</label>
<label><input type="checkbox" value="金">金</label>
<label><input type="checkbox" value="土">土</label>
<label><input type="checkbox" value="日">日</label>
</div>

<h3>開催地</h3>
<div class="grid" id="prefBox"></div>

<h3>必須ワード(カンマ区切り)</h3>
<input id="requireInput">

<h3>除外ワード(カンマ区切り)</h3>
<input id="excludeInput">

<br><br>
<button id="saveBtn" onclick="saveCondition()" disabled>追加</button>
<button onclick="editor.close()">キャンセル</button>
</dialog>

<script>
const prefectures=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県",
"埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県",
"岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
"鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県",
"佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県","［その他］"
];

const prefBox=document.getElementById("prefBox");
prefectures.forEach(p=>{

 const label = p === "［その他］" ? "その他" : p;

 prefBox.insertAdjacentHTML(
   "beforeend",
   `<label><input type="checkbox" value="${p}">${label}</label>`
 );
});

let conditions = [];
let editIndex=-1;

const saveBtn=document.getElementById("saveBtn");


function getCurrentCondition(){
 return {
  weekdays:[...document.querySelectorAll("#weekdayBox input:checked")].map(x=>x.value),
  prefectures:[...document.querySelectorAll("#prefBox input:checked")].map(x=>x.value),
  require:requireInput.value.split(",").map(x=>x.trim()).filter(Boolean),
  exclude:excludeInput.value.split(",").map(x=>x.trim()).filter(Boolean)
 };
}

function isEmptyCondition(c){
 return c.weekdays.length===0 &&
        c.prefectures.length===0 &&
        c.require.length===0 &&
        c.exclude.length===0;
}

function refreshDialogButtons(){
 const current=getCurrentCondition();

 if(editIndex<0){
   saveBtn.textContent="追加";
   saveBtn.disabled=isEmptyCondition(current);
   return;
 }

 if(isEmptyCondition(current)){
   saveBtn.textContent="削除";
   saveBtn.disabled=false;
   return;
 }

 const original=JSON.stringify(conditions[editIndex]);
 const now=JSON.stringify(current);

 saveBtn.textContent="更新";
 saveBtn.disabled=(original===now);
}

function deleteCard(index){

  conditions.splice(index,1);

  renderCards();
}
function formatConditions(conditions){

  if(!conditions.length){
    return "通知の絞り込み条件はありません。\n全ての新規イベントが通知されます。";
  }

  let message = "通知の絞り込み設定\n";

  conditions.forEach((cond,index)=>{

    if(index){
      message += "\n\nもしくは\n";
    }

    if(cond.weekdays?.length){
      message += "\n【曜日】" + cond.weekdays.join(" ");
    }

    if(cond.prefectures?.length){
      message += "\n【場所】" + cond.prefectures.join(" ");
    }

    if(cond.require?.length){
      message += "\n【必須ワード】" + cond.require.join(" ");
    }

    if(cond.exclude?.length){
      message += "\n【除外ワード】" + cond.exclude.join(" ");
    }
  });

  message += "\n\nこの条件に合致するイベントのみ通知されます。";

  return message;
}
function renderCards(){
 const cards=document.getElementById("cards");
 cards.innerHTML="";

 conditions.forEach((c,i)=>{
   const div=document.createElement("div");
   div.className="card";

   div.innerHTML=`
<button
  class="card-delete"
  onclick="event.stopPropagation();deleteCard(${i})"
>×</button>

<div class="summary">
  ${conditionSummary(c)}
</div>
`;

   div.onclick=()=>openEditor(i);
   cards.appendChild(div);
 });
  const add=document.createElement("div");
 add.className="card add-card";
 add.textContent="+";
 add.onclick=()=>openEditor(-1);
 cards.appendChild(add);
 document.getElementById("setting-output").textContent =
  formatConditions(conditions);

document.getElementById("json-output").value =
  JSON.stringify(conditions,null,2);
}
function conditionSummary(c){

  const prefs = c.prefectures
  .map(p => {
    if (p === "北海道") return p;
    if (p === "［その他］") return "その他";
    return p.slice(0, -1);
  })
  .join(" ");

  return `
<div class="summary-line">${(c.weekdays||[]).join(" ")}</div>
<div class="summary-line">${prefs}</div>
<div class="summary-line">${(c.require||[]).join(",")}</div>
<div class="summary-line">${(c.exclude||[]).join(",")}</div>
`;
}
function openEditor(index){
 editIndex=index;

 document.querySelectorAll("#weekdayBox input").forEach(x=>x.checked=false);
 document.querySelectorAll("#prefBox input").forEach(x=>x.checked=false);
 requireInput.value="";
 excludeInput.value="";

 if(index>=0){
   const c=conditions[index];
   document.querySelectorAll("#weekdayBox input").forEach(x=>x.checked=c.weekdays.includes(x.value));
   document.querySelectorAll("#prefBox input").forEach(x=>x.checked=c.prefectures.includes(x.value));
   requireInput.value=(c.require||[]).join(",");
   excludeInput.value=(c.exclude||[]).join(",");
 }

 refreshDialogButtons();
 editor.showModal();
}

function saveCondition(){

 const c=getCurrentCondition();

 if(editIndex<0){

   if(isEmptyCondition(c)) return;

   conditions.push(c);

 }else{

   if(isEmptyCondition(c)){
      conditions.splice(editIndex,1);
   }else{
      conditions[editIndex]=c;
   }
 }

 editor.close();

renderCards();

}

function downloadSettings(){
 const blob=new Blob([JSON.stringify(conditions,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="settings.json";
 a.click();
}

function applyJson(){

  try{

    const data = JSON.parse(
      document.getElementById("json-output").value
    );

    if(!Array.isArray(data)){
      throw new Error();
    }

    conditions = data.map(c => ({
      weekdays: Array.isArray(c.weekdays) ? c.weekdays : [],
      prefectures: Array.isArray(c.prefectures) ? c.prefectures : [],
      require: Array.isArray(c.require) ? c.require : [],
      exclude: Array.isArray(c.exclude) ? c.exclude : []
    }));

    renderCards();

  }catch(e){

    alert("JSONの形式が不正です");
    renderCards();
  }
}
document.getElementById("json-output")
  .addEventListener("blur", applyJson);

[...document.querySelectorAll("#editor input")].forEach(el=>{
 el.addEventListener("input",refreshDialogButtons);
 el.addEventListener("change",refreshDialogButtons);
});

renderCards();

</script>

</body>
</html>
